<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="500" r="400" fill="url(#globeGlow)"/>
  <!-- Globe wireframe -->
  <g transform="translate(960,500)">
    <circle r="220" fill="none" stroke="#2563EB" stroke-width="2.5" opacity="0.5"/>
    <ellipse rx="220" ry="80" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
    <ellipse rx="220" ry="150" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
    <ellipse rx="80" ry="220" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3"/>
    <ellipse rx="150" ry="220" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3"/>
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
  </g>
  <!-- Human figures -->
  <g opacity="0.9">
    <circle cx="520" cy="510" r="18" fill="#2563EB"/><rect x="510" y="530" width="20" height="35" rx="6" fill="#2563EB"/>
    <circle cx="740" cy="470" r="18" fill="#38BDF8"/><rect x="730" y="490" width="20" height="35" rx="6" fill="#38BDF8"/>
    <circle cx="1180" cy="470" r="18" fill="#38BDF8"/><rect x="1170" y="490" width="20" height="35" rx="6" fill="#38BDF8"/>
    <circle cx="1400" cy="510" r="18" fill="#2563EB"/><rect x="1390" y="530" width="20" height="35" rx="6" fill="#2563EB"/>
  </g>
  <!-- Connection lines -->
  <g stroke="url(#accent)" stroke-width="2.5" opacity="0.4" fill="none" stroke-dasharray="8,8">
    <line x1="538" y1="510" x2="722" y2="470"/>
    <line x1="758" y1="470" x2="1162" y2="470"/>
    <line x1="1198" y1="470" x2="1382" y2="510"/>
  </g>
  <g fill="#38BDF8">
    <circle cx="630" cy="490" r="4" opacity="0.8"/>
    <circle cx="960" cy="470" r="5" opacity="0.9"/>
    <circle cx="1290" cy="490" r="4" opacity="0.8"/>
  </g>
  <g fill="white" opacity="0.5">
    <circle cx="200" cy="200" r="2"/><circle cx="500" cy="160" r="1.5"/>
    <circle cx="900" cy="140" r="2"/><circle cx="1400" cy="180" r="2"/>
    <circle cx="1700" cy="220" r="1.5"/>
  </g>
  <rect x="0" y="1040" width="1920" height="4" fill="url(#accent)" opacity="0.5"/>
</svg>