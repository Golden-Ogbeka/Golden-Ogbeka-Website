<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="460" r="350" fill="url(#screenGlow)"/>
  <!-- Laptop -->
  <g transform="translate(960,460)">
    <rect x="-250" y="-170" width="500" height="320" rx="12" fill="#1E293B" opacity="0.9"/>
    <rect x="-230" y="-150" width="460" height="280" rx="6" fill="url(#screen)" opacity="0.8"/>
    <g opacity="0.7">
      <rect x="-190" y="-120" width="180" height="10" rx="3" fill="#38BDF8"/>
      <rect x="-190" y="-100" width="240" height="10" rx="3" fill="#2563EB"/>
      <rect x="-190" y="-80" width="140" height="10" rx="3" fill="#38BDF8" opacity="0.7"/>
      <rect x="-190" y="-60" width="200" height="10" rx="3" fill="#2563EB" opacity="0.7"/>
      <rect x="-190" y="-40" width="160" height="10" rx="3" fill="#38BDF8" opacity="0.6"/>
      <rect x="-190" y="-20" width="260" height="10" rx="3" fill="#2563EB" opacity="0.6"/>
      <rect x="-190" y="0" width="120" height="10" rx="3" fill="#38BDF8" opacity="0.5"/>
      <rect x="-190" y="20" width="200" height="10" rx="3" fill="#2563EB" opacity="0.5"/>
      <rect x="-190" y="40" width="170" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>
      <rect x="-190" y="60" width="220" height="10" rx="3" fill="#2563EB" opacity="0.4"/>
    </g>
    <rect x="-300" y="150" width="600" height="16" rx="6" fill="#1E293B" opacity="0.7"/>
    <rect x="-270" y="155" width="540" height="6" rx="3" fill="#334155" opacity="0.4"/>
  </g>
  <!-- AI neural spark -->
  <g fill="#38BDF8" opacity="0.8">
    <circle cx="960" cy="230" r="8"/><circle cx="920" cy="260" r="5" opacity="0.7"/>
    <circle cx="1000" cy="250" r="6" opacity="0.8"/><circle cx="880" cy="290" r="4" opacity="0.6"/>
    <circle cx="1040" cy="280" r="5" opacity="0.7"/><circle cx="960" cy="300" r="3" opacity="0.5"/>
  </g>
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.3" fill="none">
    <line x1="960" y1="230" x2="920" y2="260"/><line x1="960" y1="230" x2="1000" y2="250"/>
    <line x1="920" y1="260" x2="880" y2="290"/><line x1="1000" y1="250" x2="1040" y2="280"/>
    <line x1="880" y1="290" x2="960" y2="300"/><line x1="1040" y1="280" x2="960" y2="300"/>
  </g>
  <!-- Price symbols -->
  <g transform="translate(450,630)">
    <circle r="55" fill="#2563EB" opacity="0.25"/>
    <text y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="50" font-weight="800" fill="#38BDF8" opacity="0.6">$</text>
  </g>
  <g transform="translate(1470,630)">
    <circle r="55" fill="#38BDF8" opacity="0.2"/>
    <text y="12" text-anchor="middle" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#38BDF8" opacity="0.6">0</text>
  </g>
  <g stroke="url(#accent)" stroke-width="2.5" opacity="0.3" fill="none" stroke-dasharray="8,8">
    <line x1="510" y1="630" x2="1410" y2="630"/>
    <polyline points="1390,615 1410,630 1390,645"/>
  </g>
  <g fill="white" opacity="0.5">
    <circle cx="200" cy="180" r="2"/><circle cx="700" cy="140" r="1.5"/>
    <circle cx="1200" cy="160" r="2"/><circle cx="1700" cy="200" r="1.5"/>
  </g>
  <rect x="0" y="1040" width="1920" height="4" fill="url(#accent)" opacity="0.5"/>
</svg>